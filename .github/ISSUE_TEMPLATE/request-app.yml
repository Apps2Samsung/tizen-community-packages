name: "📥 Request a New App"
description: "Suggest a Tizen app you'd like added to a future bundle"
title: "[App Request] <App Name>"
labels: ["app request"]
body:
  - type: markdown
    attributes:
      value: |
        Suggesting an app you didn't build yourself? You're in the right place.
        If you *have* packaged it, use the **Contribute an App** form (or open a pull request) instead.

  - type: markdown
    attributes:
      value: |
        > ⚠️ **Please check this list first. These can't be added:**
        >
        > - **Commercial streaming apps** (Netflix, Disney+, Prime Video, HBO Max, Spotify, official YouTube, …).
        >   They're partner-signed and DRM-bound to the TV they shipped on: not redistributable, and a copied
        >   `.wgt` wouldn't activate anyway. Most Samsung TVs already have them built in.
        > - **Modded, cracked or "premium unlocked"** builds of paid apps or services.
        > - **Don't ask us to port something to Tizen OS** we don't port we only maintain the community package and our own apps
        > - **Closed-source packages without the author's permission** to redistribute them. Closed source *with*
        >   permission is fine, see [What we accept](https://github.com/Apps2Samsung/tizen-community-packages/blob/main/packages/README.md#-what-we-accept).
        > - **Apps that come with unlicensed content** (built-in IPTV playlists, pirate-site scrapers, torrent indexers)
        >   or clients for unlicensed streaming services.
        > - **Rebrands of other projects** that remove the original credits or license.
        >
        > 🏨 On a **hospitality / hotel TV** (`HG…` model), side-loading isn't possible at all: developer mode
        > lives in the Smart Hub **Apps** screen, which that firmware doesn't expose.

  - type: input
    id: name
    attributes:
      label: "🧩 App name"
      placeholder: "Fireplace"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "📝 Description"
      description: "What does the app do, and why would it be a good fit?"
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: "🔗 Source or homepage"
      description: "Link to the source code or project homepage."
      placeholder: "https://github.com/owner/repo"
    validations:
      required: true

  - type: input
    id: license
    attributes:
      label: "📋 License (if known)"
      description: "We can only include apps whose author allows redistribution."
      placeholder: "MIT"
    validations:
      required: false

  - type: textarea
    id: info
    attributes:
      label: "💡 Additional info (optional)"
      description: "Screenshots, device compatibility, or anything else useful."
    validations:
      required: false

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: "✅ Before submitting"
      options:
        - label: "This isn't a commercial streaming app, a modded build, an app with built-in unlicensed content, or a rebrand of someone else's project."
          required: true
