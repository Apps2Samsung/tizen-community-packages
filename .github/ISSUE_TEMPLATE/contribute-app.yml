name: "📦 Contribute an App"
description: "Add your Tizen app (.wgt / .tpk) to the community bundle"
title: "[Contribution] <App Name>"
labels: ["app contribution"]
body:
  - type: markdown
    attributes:
      value: |
        **The fastest way to contribute is a pull request**: add one JSON file to
        [`packages/`](https://github.com/Apps2Samsung/tizen-community-packages/blob/main/packages/README.md)
        and it's validated automatically. Use this form only if you'd prefer a maintainer to create the file for you.

        The fields below map directly onto a package manifest, so please fill them in precisely.

  - type: input
    id: name
    attributes:
      label: "🧩 App name"
      description: "Display name shown in the README table."
      placeholder: "My Tizen App"
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: "📝 Description"
      description: "One line. No `|` characters."
      placeholder: "A short description of what the app does."
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: "🔗 Repository (owner/repo)"
      description: "The GitHub repository, as `owner/repo`."
      placeholder: "yourname/your-app"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: "📦 Source type"
      description: |
        How is the `.wgt` distributed?
        • **release**: prebuilt `.wgt` attached to a GitHub Release (most common)
        • **build**: compiled from source with Tizen Studio
        • **direct**: downloaded from a fixed URL
      options:
        - release
        - build
        - direct
    validations:
      required: true

  - type: dropdown
    id: source_availability
    attributes:
      label: "🔓 Source code"
      description: "Is the app's source code in the linked repository?"
      options:
        - Open source (code is in the repository)
        - Closed source (prebuilt only; I grant or link redistribution permission)
    validations:
      required: true

  - type: dropdown
    id: self_updating
    attributes:
      label: "🔄 Self-updating"
      description: |
        Does the app download and run newer code after install (outside this catalogue)?
        Only accepted when the newer code comes from the same repository, the author's own domain for `direct`,
        or the upstream project the app is built on and names in its description (e.g. TizenTube for a TizenTube wrapper).
      options:
        - "No"
        - Yes, from the same repository or my own domain
        - Yes, from the upstream project the app is built on (named in the description)
    validations:
      required: true

  - type: input
    id: output_name
    attributes:
      label: "🧱 Output filename"
      description: "Filename inside the bundle. Must end in `.wgt`."
      placeholder: "MyApp.wgt"
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: "🌿 Branch"
      description: "For **release** and **build** only: the branch/release track. Leave blank for `direct`."
      placeholder: "release"
    validations:
      required: false

  - type: input
    id: url
    attributes:
      label: "🌐 Direct URL"
      description: "For **direct** only: absolute URL to the `.wgt`. Leave blank otherwise."
      placeholder: "https://example.com/MyApp.wgt"
    validations:
      required: false

  - type: input
    id: project_path
    attributes:
      label: "📁 Project path"
      description: "For **build** only: subdirectory containing the Tizen web project. Defaults to `.`."
      placeholder: "tizen"
    validations:
      required: false

  - type: textarea
    id: build_extras
    attributes:
      label: "⚙️ Build extras / multiple .wgt files (optional)"
      description: |
        For **build**: note if npm should be skipped, or any pre-build shell command.
        For **release** with several `.wgt` files: list each asset name and the output name you want.
      placeholder: |
        skip_npm: true
        pre_build: npm install && npm run build:tizen
        assets: Moonlight.wgt -> Moonlight-Tizen.wgt, Moonlight-GM.wgt -> Moonlight-GM.wgt
    validations:
      required: false

  - type: input
    id: license
    attributes:
      label: "🧾 License"
      description: "The app's license, e.g. MIT or GPL-3.0. Closed source? Write \"closed source\" and link where you grant redistribution (LICENSE file or README line). See [What we accept](https://github.com/Apps2Samsung/tizen-community-packages/blob/main/packages/README.md#-what-we-accept)."
      placeholder: "MIT"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: "🧪 Confirmations"
      description: "See [What we accept](https://github.com/Apps2Samsung/tizen-community-packages/blob/main/packages/README.md#-what-we-accept)."
      options:
        - label: "The app is open source, or closed source with explicit permission to redistribute it"
          required: true
        - label: "I'm the author, or the repository grants redistribution"
          required: true
        - label: "Closed source only: it isn't derived from GPL/LGPL/AGPL code (tick this for open-source apps too)"
          required: true
        - label: "It ships no content sources by default (no built-in playlists, scrapers or torrent indexers, and no preset add-on or module source that provides them)"
          required: true
        - label: "If it's a fork or based on other code: upstream is credited and its license is kept"
          required: true
        - label: "Virus/malware-free to the best of my knowledge"
          required: true
        - label: "Tested on a real Tizen device or emulator"
          required: false
        - label: "This app is for adults only (18+), and will be hidden in Apps2Samsung until the user opts in"
          required: false

  - type: textarea
    id: notes
    attributes:
      label: "💬 Notes (optional)"
      description: "Anything else a maintainer should know."
    validations:
      required: false
