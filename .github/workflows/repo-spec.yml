name: Repository spec

# Tests for the independent-repository format (docs/repositories.md): the
# validator against every test vector, the fixtures against TV-Store's own
# verify(), and the generator end to end against a real GitHub release.
# And for the official catalog format (docs/catalog.md): the schema against
# the example, a fresh build and the latest release's catalog.json.
# Plain pull_request: no secrets are involved, so fork PRs are safe to run.

on:
  pull_request:
    paths:
      - 'spec/**'
      - 'scripts/repo-*.py'
      - 'data/categories.json'
      - 'scripts/test-repo-spec.py'
      - 'scripts/package-info.py'
      - 'scripts/scan-packages.py'
      - 'scripts/build-catalog.sh'
      - 'scripts/check-categories.py'
      - 'scripts/test-catalog-spec.py'
      - 'packages.schema.json'
      - 'templates/**'
      - '.github/workflows/repo-spec.yml'
  push:
    branches: [main]
    paths:
      - 'spec/**'
      - 'scripts/repo-*.py'
      - 'data/categories.json'
      - 'scripts/test-repo-spec.py'
      - 'scripts/package-info.py'
      - 'scripts/scan-packages.py'
      - 'scripts/build-catalog.sh'
      - 'scripts/check-categories.py'
      - 'scripts/test-catalog-spec.py'
      - 'packages.schema.json'
      - 'templates/**'
      - '.github/workflows/repo-spec.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install jsonschema
      - name: Every test vector gives the expected result
        run: python3 -I scripts/test-repo-spec.py
      - name: The fixtures are what make-fixtures.py produces
        run: |
          python3 -I spec/fixtures/make-fixtures.py
          git diff --exit-code -- spec/fixtures || { echo "::error::spec/fixtures is out of date: run spec/fixtures/make-fixtures.py and commit the result"; exit 1; }

  tv-store:
    # The envelope must be the one TV-Store already verifies for the official
    # catalog, so check the fixtures with TV-Store's own catalog.js.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Apps2Samsung/TV-Store
          path: _tvstore
          persist-credentials: false
      # The Node the TV's web service runs (TV-Store tests on it too).
      - uses: actions/setup-node@v4
        with:
          node-version: '4.4.3'
      - name: TV-Store's verify() accepts valid.signed and rejects tampered ones
        run: |
          node -e '
            var c = require("./_tvstore/tizen-app/service/catalog.js"), fs = require("fs");
            var dir = "spec/fixtures/", index = JSON.parse(fs.readFileSync(dir + "index.json", "utf8"));
            var key = fs.readFileSync(dir + "keys/test.pub.pem", "utf8"), now = Date.parse(index.now);
            var r = c.verify(fs.readFileSync(dir + "valid.signed"), key, now);
            var n = Object.keys(r.index).filter(function (u) { return r.index[u]; }).length;
            if (n !== 3) throw new Error("expected 3 files with a digest in the index, got " + n);
            console.log("valid.signed: accepted, " + n + " files indexed");
            ["tampered.signed", "bad-signature.signed", "no-signature.signed"].forEach(function (f) {
              try { c.verify(fs.readFileSync(dir + f), key, now); } catch (e) { console.log(f + ": rejected (" + e.message + ")"); return; }
              throw new Error(f + " was accepted");
            });
          '
      - name: spec/official-catalog.pem is the key TV-Store trusts for the official catalog
        run: |
          node -e 'process.stdout.write(require("./_tvstore/tizen-app/service/catalog-key.js").join("\n") + "\n")' > "$RUNNER_TEMP/tv-store-key.pem"
          a=$(openssl pkey -pubin -in "$RUNNER_TEMP/tv-store-key.pem" -outform DER | sha256sum | cut -d' ' -f1)
          b=$(openssl pkey -pubin -in spec/official-catalog.pem -outform DER | sha256sum | cut -d' ' -f1)
          echo "TV-Store: $a"; echo "spec:     $b"
          [ "$a" = "$b" ] || { echo "::error::spec/official-catalog.pem differs from TV-Store's catalog-key.js: update it and the fingerprint in docs/catalog.md"; exit 1; }
          grep -q "$b" docs/catalog.md || { echo "::error::docs/catalog.md does not name the fingerprint $b"; exit 1; }

  catalog:
    # catalog.json against spec/catalog.schema.json. The schema is strict, so a
    # field added to build-catalog.sh fails here until the schema and
    # docs/catalog.md describe it too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install jsonschema
      - name: The example matches the schema
        run: python3 -I scripts/test-catalog-spec.py
      - name: A catalog built from packages/ matches the schema
        run: |
          bash scripts/build-catalog.sh packages "$RUNNER_TEMP/built.json"
          python3 -I scripts/test-catalog-spec.py "$RUNNER_TEMP/built.json"
      - name: The latest release's catalog.json matches the schema
        # The published file has what a fresh build can't: version and ids read from the packages.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" -p catalog.json -D "$RUNNER_TEMP/latest"
          python3 -I scripts/test-catalog-spec.py "$RUNNER_TEMP/latest/catalog.json"

  generate:
    # End to end with a throwaway key: build from a real repository's releases,
    # then build again from the first result (assets reused, not downloaded).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install jsonschema
      - name: Generate, sign and validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/e2e"; mkdir -p "$t"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$t/key.pem" 2>/dev/null
          cat > "$t/input.json" <<'JSON'
          {
            "repository": { "id": "io.github.apps2samsung.ci", "name": "CI test", "maintainer": "Apps2Samsung" },
            "providers": [
              { "id": "reolink-viewer", "category": "casting", "url": "Apps2Samsung/ReolinkViewer", "take": 2 }
            ]
          }
          JSON
          python3 -I scripts/repo-generate.py --input "$t/input.json" --out "$t/one" --key "$t/key.pem"
          python3 -I scripts/repo-generate.py --input "$t/input.json" --out "$t/two" --key "$t/key.pem" --previous "$t/one/repository.json.signed"
          python3 -I scripts/repo-validate.py "$t/two/repository.json.signed" --key "$t/two/repository.pem"
          python3 -I scripts/repo-validate.py "$t/two/repository.json.signed" --key "$t/two/repository.pem" --not-before "$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["generatedAt"])' "$t/one/repository.json")"
      - name: Add an app with repo-input.py, then publish it with its landing page
        # What Apps2Samsung/repository-template's "Add an app" and "Publish" workflows run.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/simple"; mkdir -p "$t"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out "$t/key.pem" 2>/dev/null
          if python3 -I scripts/repo-input.py add --file "$t/in.json" --repository someone/my-apps --app Apps2Samsung/ReolinkViewer --category nope; then
            echo "::error::an unknown category was accepted"; exit 1
          fi
          test ! -e "$t/in.json"
          python3 -I scripts/repo-input.py add --file "$t/in.json" --repository someone/my-apps --app https://github.com/Apps2Samsung/ReolinkViewer --category casting --name "Reolink Viewer"
          python3 -I scripts/repo-input.py add --file "$t/in.json" --repository someone/my-apps --app Apps2Samsung/Overscan --category tools
          python3 -I scripts/repo-input.py remove --file "$t/in.json" --app overscan
          python3 -I scripts/repo-generate.py --input "$t/in.json" --out "$t/site" --key "$t/key.pem" --site-url https://someone.github.io/my-apps | tee "$t/log"
          fp=$(sed -n 's/^key fingerprint: //p' "$t/log")
          grep -q "$fp" "$t/site/index.html"
          grep -q "https://someone.github.io/my-apps/repository.json.signed" "$t/site/index.html"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["repository"]["id"]=="io.github.someone.my-apps" and [p["id"] for p in d["providers"]]==["reolinkviewer"], d' "$t/in.json"
      - name: The template's input file is valid
        run: |
          python3 - <<'PY'
          import json
          spec = json.load(open("templates/independent-repo/repository.input.json"))
          assert spec["repository"]["id"] and spec["providers"], "template input is incomplete"
          print("template input parses:", len(spec["providers"]), "providers")
          PY
