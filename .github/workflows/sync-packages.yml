name: Sync Tizen Community Packages

on:
  schedule:
    # 04:00 UTC daily - 05:00 CET (winter) / 06:00 CEST (summer) in Brussel
    - cron: '23 2 * * *' 
  # A merged PR is a push to main. Bot commits made with GITHUB_TOKEN never
  # trigger workflows, so the state/README commit below can't loop.
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if nothing has changed'
        type: boolean
        default: false

# Never let a scheduled run and a merge run race on the tag / last_seen.json.
concurrency:
  group: sync-packages
  cancel-in-progress: false

permissions:
  contents: write

env:
  TIZEN_STUDIO_VER: 4
  CERT_NAME: CommunityPack
  CERT_PASSWORD: 1234
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      changes_summary: ${{ steps.check.outputs.changes_summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile manifests
        run: bash scripts/build-manifests.sh

      - name: Check upstream versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Push (merged PR) always rebuilds: an edited manifest isn't an upstream change.
          FORCE: ${{ github.event_name == 'push' || inputs.force == true }}
        run: |
          set -e
          STATE_FILE=".github/state/last_seen.json"
          mkdir -p .github/state
          [ -f "$STATE_FILE" ] || echo '{}' > "$STATE_FILE"
          old_state=$(cat "$STATE_FILE")
          new_state='{}'
          summary=""
          has_changes="false"

          api() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$@"
          }

          # --- Built-from-source repos (track branch HEAD) ---
          while IFS= read -r entry; do
            repo=$(echo "$entry" | jq -r '.key')
            branch=$(echo "$entry" | jq -r '.value.branch')
            host=$(echo "$entry" | jq -r '.value.host // "github"')
            if [ "$host" = "gitlab" ]; then
              # GitLab: project id is the URL-encoded "owner%2Frepo" path.
              gl_id=$(printf '%s' "$repo" | sed 's|/|%2F|g')
              sha=$(curl -fsSL "https://gitlab.com/api/v4/projects/$gl_id/repository/branches/$branch" 2>/dev/null | jq -r '.commit.id // empty')
            else
              sha=$(api "https://api.github.com/repos/$repo/commits/$branch" 2>/dev/null | jq -r '.sha // empty')
            fi
            if [ -z "$sha" ]; then
              echo "WARN: could not fetch HEAD for $repo@$branch - keeping previous state"
              prev=$(echo "$old_state" | jq -r --arg k "build:$repo@$branch" '.[$k] // empty')
              [ -n "$prev" ] && sha="$prev" || continue
            fi
            key="build:$repo@$branch"
            new_state=$(echo "$new_state" | jq --arg k "$key" --arg v "$sha" '. + {($k): $v}')
            old_val=$(echo "$old_state" | jq -r --arg k "$key" '.[$k] // empty')
            if [ "$old_val" != "$sha" ]; then
              summary="${summary}"$'\n'"- build $repo ($branch) -> ${sha:0:7}"
              has_changes="true"
            fi
          done < <(jq -c 'to_entries[]' repos-build.json)

          # --- Release-based repos (track latest tag) ---
          while IFS= read -r entry; do
            repo=$(echo "$entry" | jq -r '.key')
            json=$(api "https://api.github.com/repos/$repo/releases/latest" 2>/dev/null || echo '')
            tag=$(echo "$json" | jq -r '.tag_name // empty')
            if [ -z "$tag" ]; then
              json=$(api "https://api.github.com/repos/$repo/releases?per_page=20" 2>/dev/null || echo '[]')
              tag=$(echo "$json" | jq -r '[.[] | select(.prerelease==true and .draft==false)][0].tag_name // empty')
            fi
            if [ -z "$tag" ]; then
              echo "WARN: no releases for $repo - keeping previous state"
              prev=$(echo "$old_state" | jq -r --arg k "release:$repo" '.[$k] // empty')
              [ -n "$prev" ] && tag="$prev" || continue
            fi
            key="release:$repo"
            new_state=$(echo "$new_state" | jq --arg k "$key" --arg v "$tag" '. + {($k): $v}')
            old_val=$(echo "$old_state" | jq -r --arg k "$key" '.[$k] // empty')
            if [ "$old_val" != "$tag" ]; then
              summary="${summary}"$'\n'"- release $repo -> $tag"
              has_changes="true"
            fi
          done < <(jq -c '.releases | to_entries[]' repos-sync.json)

          # --- Direct URLs (fingerprint via ETag / Last-Modified / Content-Length) ---
          while IFS= read -r entry; do
            repo=$(echo "$entry" | jq -r '.key')
            url=$(echo "$entry" | jq -r '.value.url')
            headers=$(curl -fsSIL "$url" 2>/dev/null | tr -d '\r' || true)
            etag=$(echo "$headers" | grep -i '^etag:' | tail -n1 | cut -d: -f2- | sed 's/^ *//')
            lastmod=$(echo "$headers" | grep -i '^last-modified:' | tail -n1 | cut -d: -f2- | sed 's/^ *//')
            clen=$(echo "$headers" | grep -i '^content-length:' | tail -n1 | cut -d: -f2- | tr -d ' ')
            fingerprint="etag:${etag}|mod:${lastmod}|len:${clen}"
            if [ "$fingerprint" = "etag:|mod:|len:" ]; then
              echo "WARN: no fingerprint headers for $url - treating as changed"
              fingerprint="unknown:$(date +%s)"
            fi
            key="direct:$repo"
            new_state=$(echo "$new_state" | jq --arg k "$key" --arg v "$fingerprint" '. + {($k): $v}')
            old_val=$(echo "$old_state" | jq -r --arg k "$key" '.[$k] // empty')
            if [ "$old_val" != "$fingerprint" ]; then
              summary="${summary}"$'\n'"- direct $repo -> $fingerprint"
              has_changes="true"
            fi
          done < <(jq -c '.direct | to_entries[]' repos-sync.json)

          if [ "$FORCE" = "true" ]; then
            echo "Force flag set - treating as changed"
            has_changes="true"
            summary="${summary}"$'\n'"(forced via ${{ github.event_name }})"
          fi

          echo "$new_state" | jq '.' > new_last_seen.json

          echo "--- new state ---"
          cat new_last_seen.json
          echo "--- summary ---"
          echo "${summary:-No changes.}"

          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          {
            echo "changes_summary<<__END__"
            echo "${summary:-No changes.}"
            echo "__END__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload candidate state
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: last-seen-state
          path: new_last_seen.json

  prepare:
    # Only makes sure the Tizen Studio Web CLI is in the actions cache. On a hit
    # this is a few-second lookup; every build-matrix leg then restores the SDK
    # straight from cache instead of pulling a 400MB artifact. On a miss it
    # installs once and saves, so the matrix never installs in parallel.
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Look up Tizen SDK cache
        id: tizen-sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: tizen-studio
          key: tizen-web-sdk-4.0
          lookup-only: true

      - name: Install Tizen Studio Web CLI
        if: steps.tizen-sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tizen-studio
          curl -L -o tizen-installer \
            "https://github.com/Apps2Samsung/tizen-community-packages/releases/download/tizen-deps-5.5/web-cli_Tizen_Studio_4.0_ubuntu-64.bin"
          chmod +x tizen-installer
          ./tizen-installer --accept-license "$GITHUB_WORKSPACE/tizen-studio"
          rm tizen-installer
          chmod -R +x tizen-studio

      - name: Save SDK to cache
        if: steps.tizen-sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tizen-studio
          key: tizen-web-sdk-4.0


  generate-matrix-build:
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile manifests
        run: bash scripts/build-manifests.sh
      - id: set-matrix
        run: |
          matrix=$(jq -c \
            '{include: [to_entries[] | {
              repo: .key,
              repo_id: (.key | gsub("/"; "-")),
              manifest: ("packages/" + (.key | gsub("/"; "__")) + ".json"),
              branch: .value.branch,
              project_path: (.value.project_path // "."),
              output_name: (.value.output_name // ""),
              skip_npm: (.value.skip_npm // false),
              pre_build: (.value.pre_build // ""),
              overlay: (.value.overlay // ""),
              host: (.value.host // "github")
            }]}' repos-build.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  tizen-build:
    runs-on: ubuntu-24.04
    needs: [prepare, generate-matrix-build]
    # A hung upstream build (npm, pre_build, packaging) must not hold the whole
    # release for GitHub's 6h default. A timeout counts as a failed leg, and the
    # release still ships the rest.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-matrix-build.outputs.matrix).include }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore Tizen SDK from cache
        uses: actions/cache/restore@v4
        with:
          path: tizen-studio
          key: tizen-web-sdk-4.0
          fail-on-cache-miss: true
      - name: Restore build cache
        # Per-package scratch space that pre_build may reuse across runs for
        # expensive, pinned inputs (e.g. the jellyfin-web build at a fixed tag).
        # Keyed on the manifest, so editing pre_build starts from scratch.
        if: matrix.pre_build != ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/build-cache
          key: build-cache-${{ matrix.repo_id }}-${{ hashFiles(matrix.manifest) }}
      # PR #59: upstream apps increasingly require Node 24 (e.g. jellyfin-web).
      # This is the job that actually runs npm / pre_build, so it belongs here,
      # not in prepare (which never touches node).
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fix Tizen Studio permissions
        run: chmod -R +x tizen-studio
      - name: Create signing certificate
        run: |
          mkdir -p tizen-studio-data/keystore/author tizen-studio-data/profile
          ./tizen-studio/tools/ide/bin/tizen certificate \
            -a "$CERT_NAME" -p "$CERT_PASSWORD" \
            -c NL -s Community -ct World \
            -o "$CERT_NAME" -n "$CERT_NAME" \
            -e community@example.org -f "$CERT_NAME"
          ./tizen-studio/tools/ide/bin/tizen security-profiles add \
            -n "$CERT_NAME" \
            -a "./tizen-studio-data/keystore/author/${CERT_NAME}.p12" \
            -p "$CERT_PASSWORD"
          ./tizen-studio/tools/ide/bin/tizen cli-config \
            "profiles.path=./tizen-studio-data/profile/profiles.xml"

      - name: Create expect script
        run: |
          printf '%s\n' \
            '#!/usr/bin/expect -f' \
            'set timeout 300' \
            'set build_dir [lindex $argv 0]' \
            'spawn $env(TIZEN_PATH)/tools/ide/bin/tizen package -t wgt -s CommunityPack -- $build_dir' \
            'expect {' \
            '  "Author password:" { send "$env(CERT_PASSWORD)\r"; exp_continue }' \
            '  "Distributor1 password:" { send "$env(CERT_PASSWORD)\r"; exp_continue }' \
            '  eof' \
            '}' \
            > package.exp
          chmod +x package.exp
      # apt on a fresh runner can block for a long time (dpkg lock held by
      # unattended-upgrades, stalled mirror). Try the image's existing index
      # first, retry with a refresh, and never let this step eat the job budget.
      - name: Install expect
        timeout-minutes: 8
        run: |
          export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a
          for i in 1 2 3; do
            if sudo -E apt-get -o DPkg::Lock::Timeout=120 install -y --no-install-recommends expect; then
              break
            fi
            echo "apt attempt $i failed, refreshing index and retrying"
            sudo -E apt-get -o DPkg::Lock::Timeout=120 update || true
            sleep 10
          done
          command -v expect
      - name: Build Tizen Web Project
        shell: bash
        env:
          TIZEN_PATH: ${{ github.workspace }}/tizen-studio
          SKIP_NPM: ${{ matrix.skip_npm }}
          PRE_BUILD: ${{ matrix.pre_build }}
          OVERLAY: ${{ matrix.overlay }}
          PROJECT_PATH: ${{ matrix.project_path }}
          HOST: ${{ matrix.host }}
          BUILD_CACHE: ${{ runner.temp }}/build-cache
        run: |
          set -e
          mkdir -p build wgt_files "$BUILD_CACHE"
          cd build
          case "$HOST" in
            gitlab) clone_url="https://gitlab.com/${{ matrix.repo }}.git" ;;
            *)      clone_url="https://github.com/${{ matrix.repo }}.git" ;;
          esac
          echo "Cloning $clone_url (${{ matrix.branch }})"
          git clone --depth 1 --branch "${{ matrix.branch }}" "$clone_url"
          cd "$(basename "${{ matrix.repo }}")"
          repo_root="$(pwd)"

          # Optional npm install + pre_build, run at the repo root.
          if [ -f package.json ] && [ "$SKIP_NPM" != "true" ]; then
            echo "npm install..."
            npm install --no-audit --no-fund --legacy-peer-deps
          fi
          if [ -n "$PRE_BUILD" ]; then
            echo "pre_build: $PRE_BUILD"
            bash -lc "$PRE_BUILD"
          fi

          # The Tizen packager zips the whole project directory, so a project at the
          # repo root would ship its .git history inside the .wgt (TizenFeed was
          # 70MB of mostly git objects) and the package would differ on every
          # build because of clone timestamps. The clone and pre_build are done
          # with it by now.
          rm -rf "$repo_root/.git"

          cd "$repo_root/$PROJECT_PATH"

          # Optional overlay: copy apps/<overlay>/ over the project before packaging
          # (e.g. a config.xml for upstreams that don't ship a Tizen manifest).
          if [ -n "$OVERLAY" ]; then
            echo "Applying overlay: apps/$OVERLAY"
            cp -R "$GITHUB_WORKSPACE/apps/$OVERLAY/." ./
          fi

          echo "Building in: $(pwd)"
          "$TIZEN_PATH/tools/ide/bin/tizen" build-web
          echo "Packaging..."
          expect "$GITHUB_WORKSPACE/package.exp" "$(pwd)"
          actual=$(ls *.wgt | head -n 1)
          desired="${{ matrix.output_name }}"
          if [ -z "$desired" ] || [ "$desired" = "null" ]; then
            desired="$actual"
          fi
          cp "$actual" "$GITHUB_WORKSPACE/wgt_files/$desired"
      - uses: actions/upload-artifact@v4
        with:
          name: built-wgts-${{ matrix.repo_id }}
          path: wgt_files/
          compression-level: 0   # .wgt files are already zips

  external-downloads:
    # Independent of the build matrix, so it runs alongside it.
    runs-on: ubuntu-24.04
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Compile manifests
        run: bash scripts/build-manifests.sh

      - name: Prepare folder
        run: mkdir -p external_wgts

      - name: Locate repos-sync.json
        id: config
        run: |
          if [ -f "repos-sync.json" ]; then
            echo "config=repos-sync.json" >> "$GITHUB_OUTPUT"
          elif [ -f ".github/workflows/repos-sync.json" ]; then
            echo "config=.github/workflows/repos-sync.json" >> "$GITHUB_OUTPUT"
          else
            echo "config=" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release WGTs
        if: ${{ steps.config.outputs.config != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          api() {
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$@"
          }
          CFG="${{ steps.config.outputs.config }}"
          repos=$(jq -r '.releases | to_entries[] | .key' "$CFG")

          # A single dead/renamed/asset-less upstream must not break the whole catalog sync -
          # collect skips and warn, don't `exit 1`.
          SKIPPED=""

          for repo in $repos; do
            latest_api="https://api.github.com/repos/$repo/releases/latest"
            list_api="https://api.github.com/repos/$repo/releases?per_page=20"

            echo "Fetching release for $repo ..."

            # 1) Try /releases/latest (non-prerelease, non-draft).
            json=$(api "$latest_api" 2>/dev/null || echo '')

            # 2) Probe whether /latest actually gave us a usable URL.
            #    Note: relying on a count is fragile because `jq` on empty
            #    input exits 0 with no output, so the `|| echo 0` fallback
            #    never fires. Probing for an actual URL avoids that.
            probe_url=$(echo "$json" | jq -r '(.assets // [])[] | .browser_download_url // empty' 2>/dev/null | head -n 1 || echo '')

            # 3) Fall back to newest non-draft prerelease if /latest had nothing.
            if [ -z "$probe_url" ]; then
              echo "  No /latest assets for $repo, falling back to newest prerelease..."
              list_json=$(api "$list_api" 2>/dev/null || echo '[]')
              json=$(echo "$list_json" | jq '[.[] | select(.prerelease==true and .draft==false)][0]' 2>/dev/null || echo 'null')
            fi

            # Decide: new-style (.assets array) or legacy (.output_name single).
            has_assets=$(jq -r ".releases[\"$repo\"] | has(\"assets\")" "$CFG")

            if [ "$has_assets" = "true" ]; then
              # New style - iterate the configured assets array, match by exact name then regex.
              # Read each field with `jq -r` by index (NOT @tsv): @tsv escapes backslashes,
              # which corrupts regex matches like "\.wgt$" into "\\.wgt$".
              n_assets=$(jq -r ".releases[\"$repo\"].assets | length" "$CFG")
              for idx in $(seq 0 $((n_assets - 1))); do
                match=$(jq -r ".releases[\"$repo\"].assets[$idx].match" "$CFG")
                outname=$(jq -r ".releases[\"$repo\"].assets[$idx].output_name // \"\"" "$CFG")
                extract=$(jq -r ".releases[\"$repo\"].assets[$idx].extract // \"\"" "$CFG")
                url=$(echo "$json" | jq -r --arg m "$match" \
                  '(.assets // [])[] | select(.name == $m) | .browser_download_url' 2>/dev/null | head -n 1)
                if [ -z "$url" ]; then
                  url=$(echo "$json" | jq -r --arg m "$match" \
                    '(.assets // [])[] | select(.name | test($m)) | .browser_download_url' 2>/dev/null | head -n 1)
                fi
                if [ -z "$url" ]; then
                  echo "::warning title=Package skipped::Asset matching '$match' not found in release for $repo - skipping this package (repo may be private/renamed/removed, or its release dropped the asset)."
                  echo "  Available assets:"
                  echo "$json" | jq -r '(.assets // [])[] | .name' 2>/dev/null || echo "  (none)"
                  SKIPPED="$SKIPPED $repo"
                  continue 2   # skip the rest of this repo's assets and move to the next repo
                fi
                if [ -z "$outname" ] || [ "$outname" = "null" ]; then
                  outname="$(basename "$url")"
                fi
                echo "Downloading $url -> external_wgts/$outname"
                curl -L -o "external_wgts/$outname" "$url"
                bash scripts/unwrap-zip.sh "external_wgts/$outname" "$extract"
              done
            else
              # Legacy style - first non-empty URL across all assets (matches old behavior).
              outname=$(jq -r ".releases[\"$repo\"].output_name" "$CFG")
              extract=$(jq -r ".releases[\"$repo\"].extract // \"\"" "$CFG")
              url=$(echo "$json" | jq -r '(.assets // [])[] | .browser_download_url // empty' 2>/dev/null | head -n 1)
              if [ -z "$url" ]; then
                echo "::warning title=Package skipped::No release asset found for $repo (latest or prerelease) - skipping this package."
                SKIPPED="$SKIPPED $repo"
                continue
              fi
              if [ -z "$outname" ] || [ "$outname" = "null" ]; then
                outname="$(basename "$url")"
              fi
              echo "Downloading $url -> external_wgts/$outname"
              curl -L -o "external_wgts/$outname" "$url"
              bash scripts/unwrap-zip.sh "external_wgts/$outname" "$extract"
            fi
          done

          if [ -n "$SKIPPED" ]; then
            echo "::warning title=Some packages skipped::The sync completed but skipped:${SKIPPED}"
          fi

      - name: Download direct WGT URLs
        if: ${{ steps.config.outputs.config != '' }}
        run: |
          CFG="${{ steps.config.outputs.config }}"
          jq -r '.direct | to_entries[] | "\(.key) \(.value.url // .value) \(.value.output_name // "") \(.value.extract // "")"' "$CFG" |
          while read -r repo url outname extract; do
            [ -n "$repo" ] || continue
            if [ -z "$outname" ] || [ "$outname" = "null" ]; then
              outname="${repo##*/}.wgt"
            fi
            curl -L -o "external_wgts/$outname" "$url"
            bash scripts/unwrap-zip.sh "external_wgts/$outname" "$extract"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: external-wgts
          path: external_wgts/
          compression-level: 0   # already-compressed packages

  publish-release:
    runs-on: ubuntu-24.04
    needs: [detect-changes, tizen-build, external-downloads]
    if: ${{ !cancelled() && needs.external-downloads.result == 'success' && (needs.tizen-build.result == 'success' || needs.tizen-build.result == 'failure') }}
    steps:
      - uses: actions/checkout@v4

      - name: Start ClamAV install (background)
        # apt runs while the artifacts download below; "Wait for ClamAV" joins it.
        # The distro AppArmor profile confines freshclam to /etc/clamav and
        # /var/lib/clamav, so it is unloaded to let it use the cached database dir.
        run: |
          sudo -E setsid nohup sh -c '
            apt-get -qq update && DEBIAN_FRONTEND=noninteractive apt-get -qq install -y --no-install-recommends clamav
            systemctl stop clamav-freshclam 2>/dev/null; systemctl disable clamav-freshclam 2>/dev/null
            apparmor_parser -R /etc/apparmor.d/usr.bin.freshclam 2>/dev/null
            echo CLAMAV_INSTALL_DONE' > "$RUNNER_TEMP/clamav-install.log" 2>&1 &

      - name: Cache key for this week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore ClamAV database cache
        # One cache entry per ISO week; freshclam then only pulls the daily deltas.
        uses: actions/cache@v4
        with:
          path: clamav-db
          key: clamav-db-${{ steps.week.outputs.week }}
          restore-keys: clamav-db-

      - name: Restore ClamAV verdict cache
        # ClamAV scans at a few MB/s and the bundle is ~600MB, so verdicts are
        # cached per file hash: a daily run only scans packages that changed.
        # The key rolls over with the definitions cache, so everything is
        # rescanned against fresh signatures once a week.
        uses: actions/cache@v4
        with:
          path: clamav-verdicts.json
          key: clamav-verdicts-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: clamav-verdicts-${{ steps.week.outputs.week }}-

      - uses: actions/download-artifact@v4
        with:
          pattern: built-wgts-*
          path: built
      - uses: actions/download-artifact@v4
        with:
          name: external-wgts
          path: external

      - name: Merge all wgt files
        run: |
          mkdir -p final_wgts
          cp built/**/*.wgt final_wgts/ 2>/dev/null || true
          cp external/*.wgt final_wgts/ 2>/dev/null || true
          cp external/*.tpk final_wgts/ 2>/dev/null || true

          # A .wgt is itself a zip, so a zip *wrapping* a .wgt copies in here
          # unnoticed and ships an uninstallable file. Drop those rather than
          # exiting, so one bad upstream cannot sink the whole bundle.
          # A file with its own manifest at the root is a real package even if
          # it carries a stray .wgt (Simple TV Player ships its previous build
          # inside); that one ships as-is.
          command -v unzip >/dev/null || sudo apt-get install -y unzip
          for f in final_wgts/*.wgt final_wgts/*.tpk; do
            [ -e "$f" ] || continue
            case "$f" in *.tpk) manifest=tizen-manifest.xml ;; *) manifest=config.xml ;; esac
            entries=$(unzip -Z1 "$f" 2>/dev/null || true)
            has_manifest=false
            echo "$entries" | grep -qx "$manifest" && has_manifest=true
            if echo "$entries" | grep -qiE '\.(wgt|tpk)$'; then
              if [ "$has_manifest" = "true" ]; then
                echo "::warning title=Nested archive::$(basename "$f") has a .wgt/.tpk inside next to its own $manifest - shipping it as a package, the inner file is just dead weight."
              else
                echo "::warning title=Nested archive::$(basename "$f") contains a .wgt/.tpk - it is a zip wrapper, not a package. Set \"extract\" in its manifest. Dropping it from this bundle."
                rm -f "$f"
              fi
            elif [ "$has_manifest" != "true" ]; then
              echo "::warning title=No $manifest::$(basename "$f") has no $manifest at its root - it may not be a valid package."
            fi
          done

          echo "Final WGT files:"
          ls -l final_wgts

      - name: Wait for ClamAV and refresh definitions
        # Never fatal: without ClamAV the scan still runs, the report says so.
        run: |
          for i in $(seq 1 60); do
            grep -q CLAMAV_INSTALL_DONE "$RUNNER_TEMP/clamav-install.log" 2>/dev/null && break
            sleep 3
          done
          if ! command -v clamscan >/dev/null; then
            echo "::warning title=ClamAV::Install did not finish; scanning without it."
            tail -n 20 "$RUNNER_TEMP/clamav-install.log" || true
            exit 0
          fi
          mkdir -p clamav-db
          printf 'DatabaseMirror database.clamav.net\nDatabaseDirectory %s\nDatabaseOwner %s\n' "$PWD/clamav-db" "$(id -un)" > "$RUNNER_TEMP/freshclam.conf"
          freshclam --config-file="$RUNNER_TEMP/freshclam.conf" --datadir="$PWD/clamav-db" \
            || echo "::warning title=ClamAV::Could not refresh virus definitions; scanning with the cached set."
          ls -l clamav-db

      - name: Security scan
        # Mechanical scan of every file about to ship (see scripts/scan-packages.py):
        # privileges, hosts referenced, signatures, obfuscation / miner signatures,
        # ClamAV. Packages with a critical finding are moved to quarantine/ and
        # dropped from the bundle; everything else ships, with the report attached
        # to the release and shown in the job summary.
        env:
          CLAMAV_DB: ${{ github.workspace }}/clamav-db
        run: |
          python3 -I scripts/scan-packages.py final_wgts \
            --json final_wgts/scan.json --md final_wgts/scan-report.md --quarantine quarantine \
            --clamav-cache clamav-verdicts.json --clamav-jobs 4
          cat final_wgts/scan-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -d quarantine ] && [ -n "$(ls -A quarantine)" ]; then
            echo "::error title=Quarantined::Dropped from this bundle after the security scan: $(ls quarantine | tr '\n' ' ')"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan
          path: |
            final_wgts/scan-report.md
            final_wgts/scan.json
            quarantine/
          if-no-files-found: ignore

      - name: Build catalog.json
        # Per-file index (category, group, variant) that Apps2Samsung reads from
        # this release to filter the app list. Only files that made the bundle.
        run: bash scripts/build-catalog.sh packages final_wgts/catalog.json final_wgts

      - name: Create and push release tag
        env:
          TAG: "community-${{ github.run_number }}"
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin - reusing it."
          else
            git tag -a "$TAG" -m "Community Packages ${{ github.run_number }}"
            git push origin "$TAG"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "community-${{ github.run_number }}"
          name: "Community Packages ${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          files: |
            final_wgts/*.wgt
            final_wgts/*.tpk
            final_wgts/catalog.json
            final_wgts/scan-report.md
            final_wgts/scan.json
          body: |
            Automated community bundle.

            Every file in this bundle went through the [automated security scan](../../blob/main/README.md#-security-scanning);
            the result is attached as `scan-report.md` (privileges, hosts, signatures, ClamAV).

            **Changes since last bundle:**
            ${{ needs.detect-changes.outputs.changes_summary }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tell Apps2Samsung a new bundle is out, so its resolved catalog
  # (apps2samsung.com/catalog/resolved.json, the file the installer reads
  # instead of the GitHub API) refreshes right away rather than at its next
  # half-hour cron tick. Needs A2S_DISPATCH_TOKEN: a fine-grained PAT with
  # Contents read/write on Apps2Samsung/Apps2Samsung (GITHUB_TOKEN cannot
  # reach another repo). Without it this just warns; the cron still catches up.
  notify-apps2samsung:
    runs-on: ubuntu-24.04
    needs: [publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    steps:
      - name: Dispatch community-release to Apps2Samsung/Apps2Samsung
        env:
          GH_TOKEN: ${{ secrets.A2S_DISPATCH_TOKEN }}
          TAG: "community-${{ github.run_number }}"
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::A2S_DISPATCH_TOKEN is not set; Apps2Samsung will pick up $TAG on its next scheduled snapshot instead."
            exit 0
          fi
          gh api --method POST repos/Apps2Samsung/Apps2Samsung/dispatches \
            -f event_type=community-release \
            -f "client_payload[repo]=${GITHUB_REPOSITORY}" \
            -f "client_payload[tag]=${TAG}"
          echo "Dispatched community-release for $TAG."

  update-state:
    runs-on: ubuntu-24.04
    needs: [detect-changes, publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' && needs.detect-changes.outputs.has_changes == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: last-seen-state
          path: .state-download

      - name: Apply new state
        run: |
          set -e
          mkdir -p .github/state
          mv .state-download/new_last_seen.json .github/state/last_seen.json

      - name: Render README package table
        run: python3 -I scripts/render-readme.py

      - name: Commit state + README
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/state/last_seen.json README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: update state + README versions [skip ci]"
            git push
          fi