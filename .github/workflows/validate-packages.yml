name: Validate Package Manifests

on:
  # pull_request_target runs immediately for fork PRs (no "Approve and run").
  # It runs THIS workflow from the base branch with the base repo's token, so
  # PR code must never be executed: only the PR's packages/*.json are pulled
  # in, as data. Schema, scripts and this workflow always come from main.
  pull_request_target:
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Base branch checkout: trusted schema, scripts and workflow. Full history
      # so the step below can find the PR's merge base with main.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # Overlay ONLY the manifests the PR itself adds, changes or deletes,
      # measured against its merge base with main. Everything else keeps main's
      # copy: a fork branched before a schema change (e.g. the required
      # category field) must not fail on the manifests it never touched.
      # The files are read by jq / check-jsonschema / python json.load, never
      # executed. The list of added/changed manifests is reused by the steps
      # below (the "Not already in the catalog" and security-scan steps).
      - name: Take the PR's changed manifests
        if: github.event_name == 'pull_request_target'
        run: |
          set -e
          git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head:pr"
          base=$(git merge-base HEAD pr)
          echo "Validating PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }}), merge base $base"
          # --no-renames: a renamed manifest is a delete plus an add.
          git diff --no-renames --name-only --diff-filter=AM "$base" pr -- packages/ > "$RUNNER_TEMP/pr-changed"
          git diff --no-renames --name-only --diff-filter=D  "$base" pr -- packages/ > "$RUNNER_TEMP/pr-deleted"
          if [ -s "$RUNNER_TEMP/pr-changed" ]; then
            echo "Added/changed:"; sed 's/^/  /' "$RUNNER_TEMP/pr-changed"
            xargs -d '\n' git checkout pr -- < "$RUNNER_TEMP/pr-changed"
          fi
          if [ -s "$RUNNER_TEMP/pr-deleted" ]; then
            echo "Deleted:"; sed 's/^/  /' "$RUNNER_TEMP/pr-deleted"
            xargs -d '\n' rm -f -- < "$RUNNER_TEMP/pr-deleted"
          fi
          # Later steps read this list; only manifests (packages/*.json) count.
          grep -E '^packages/[^/]+\.json$' "$RUNNER_TEMP/pr-changed" > "$RUNNER_TEMP/pr-manifests" || true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools
        run: pip install check-jsonschema

      - name: JSON Schema validation
        run: check-jsonschema --schemafile packages.schema.json packages/*.json

      - name: Structural checks (filenames, uniqueness)
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          errors = []
          repos, outputs = {}, {}

          # Only *.json manifests (and the README) belong in packages/. Anything
          # else - typically a manifest saved without the .json extension - would
          # pass every check below and never be synced.
          for name in sorted(os.listdir("packages")):
              if name != "README.md" and not name.endswith(".json"):
                  errors.append(f"{name}: not a manifest; files in packages/ must be named owner__repo.json")

          for path in sorted(glob.glob("packages/*.json")):
              doc = json.load(open(path))
              repo = doc["repo"]

              # filename must match the repo slug: owner/repo -> owner__repo.json
              expected = repo.replace("/", "__") + ".json"
              actual = os.path.basename(path)
              if actual != expected:
                  errors.append(f"{actual}: filename must be '{expected}' (derived from repo '{repo}')")

              # one manifest per repo
              if repo in repos:
                  errors.append(f"{actual}: repo '{repo}' already defined in {repos[repo]}")
              repos[repo] = actual

              # output_name must be unique across the whole bundle (top-level + assets)
              names = []
              if "output_name" in doc:
                  names.append(doc["output_name"])
              for a in doc.get("assets", []):
                  names.append(a["output_name"])
              for n in names:
                  if n in outputs:
                      errors.append(f"{actual}: output_name '{n}' already used by {outputs[n]}")
                  outputs[n] = actual

          if errors:
              print("::error::Manifest validation failed:")
              for e in errors:
                  print(f"::error::  {e}")
              sys.exit(1)
          print(f"OK â€” {len(repos)} manifests, {len(outputs)} unique output names.")
          PY

      - name: Not already in the catalog
        # A repo or display name that another manifest already carries (any case),
        # or that Apps2Samsung lists on its own from its hardcoded
        # third-party-apps.json (Jellyfin, Moonfin, TizenTube, ...). Errors for the
        # manifests this PR touches, warnings for the rest.
        run: |
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            # shellcheck disable=SC2046
            python3 -I scripts/check-duplicates.py --changed $(cat "$RUNNER_TEMP/pr-manifests")
          else
            python3 -I scripts/check-duplicates.py
          fi

      - name: Manifests compile cleanly
        run: bash scripts/build-manifests.sh

      - name: Catalog compiles cleanly
        run: bash scripts/build-catalog.sh packages "$RUNNER_TEMP/catalog.json"

      - name: Security scan of new or changed packages
        # Downloads the current upstream artifact for every release/direct manifest
        # the PR adds or changes and runs scripts/scan-packages.py on it, so the
        # privileges, hosts and signatures of a new app are in the job summary
        # before anyone merges. Downloads are untrusted data: unzipped and read
        # in their own directory, never executed. Build-sourced apps are scanned
        # by the sync once they are compiled.
        # Two things fail the PR here rather than only warning: a single output_name on a
        # release with several assets (the sync always takes the first one, e.g. a Windows
        # zip or an APK), and a download with no config.xml / tizen-manifest.xml (a package
        # that can never install, whatever picked it).
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          api() { curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          mkdir -p _scan
          failed=0
          changed=$(cat "$RUNNER_TEMP/pr-manifests")
          for f in $changed; do
            [ -f "$f" ] || continue
            src=$(jq -r '.source' "$f"); repo=$(jq -r '.repo' "$f")
            [ "$(jq -r '.enabled != false' "$f")" = "true" ] || continue
            if [ "$src" = "direct" ]; then
              out=$(jq -r '.output_name' "$f")
              curl -fsSL -o "_scan/$out" "$(jq -r '.url' "$f")" || { echo "::warning file=$f::download failed"; continue; }
              bash scripts/unwrap-zip.sh "_scan/$out" "$(jq -r '.extract // ""' "$f")"
            elif [ "$src" = "release" ]; then
              json=$(api "https://api.github.com/repos/$repo/releases/latest" 2>/dev/null || echo '')
              if [ -z "$(echo "$json" | jq -r '(.assets // [])[0].browser_download_url // empty' 2>/dev/null)" ]; then
                json=$(api "https://api.github.com/repos/$repo/releases?per_page=20" 2>/dev/null | jq '[.[] | select(.prerelease==true and .draft==false)][0]' 2>/dev/null || echo 'null')
              fi
              if [ "$(jq -r 'has("assets")' "$f")" = "true" ]; then
                n=$(jq -r '.assets | length' "$f")
                for i in $(seq 0 $((n - 1))); do
                  m=$(jq -r ".assets[$i].match" "$f"); out=$(jq -r ".assets[$i].output_name" "$f"); ex=$(jq -r ".assets[$i].extract // \"\"" "$f")
                  url=$(echo "$json" | jq -r --arg m "$m" '(.assets // [])[] | select(.name == $m) | .browser_download_url' | head -n 1)
                  [ -n "$url" ] || url=$(echo "$json" | jq -r --arg m "$m" '(.assets // [])[] | select(.name | test($m)) | .browser_download_url' | head -n 1)
                  [ -n "$url" ] || { echo "::warning file=$f::no release asset matches '$m' - nothing to scan"; continue; }
                  curl -fsSL -o "_scan/$out" "$url" && bash scripts/unwrap-zip.sh "_scan/$out" "$ex"
                done
              else
                out=$(jq -r '.output_name' "$f"); ex=$(jq -r '.extract // ""' "$f")
                count=$(echo "$json" | jq -r '(.assets // []) | length')
                if [ "${count:-0}" -gt 1 ]; then
                  names=$(echo "$json" | jq -r '[(.assets // [])[].name] | join(", ")')
                  echo "::error file=$f,title=Ambiguous release asset::The latest release of $repo has $count assets ($names). A single output_name always downloads the first one. Use assets[] with a match for the .wgt/.tpk instead (see packages/README.md)."
                  failed=1
                  continue
                fi
                url=$(echo "$json" | jq -r '(.assets // [])[] | .browser_download_url // empty' | head -n 1)
                [ -n "$url" ] || { echo "::warning file=$f::no release asset found - nothing to scan"; continue; }
                curl -fsSL -o "_scan/$out" "$url" && bash scripts/unwrap-zip.sh "_scan/$out" "$ex"
              fi
            fi
          done
          if [ -z "$(ls -A _scan)" ]; then
            echo "No release/direct packages changed in this PR - nothing to scan."
            exit $failed
          fi
          python3 -I scripts/scan-packages.py _scan --md scan-report.md --json scan.json --no-clamav --fail-on critical || failed=1
          { echo "## Security scan of packages changed in this PR"; echo; cat scan-report.md; } >> "$GITHUB_STEP_SUMMARY"
          not_tizen=$(jq -r '.packages[] | select(any(.findings[]?; .code == "no-manifest" or .code == "bad-manifest" or .code == "no-app-id")) | .file' scan.json)
          for p in $not_tizen; do
            echo "::error title=Not a Tizen package::$p has no usable config.xml / tizen-manifest.xml, so it will not install. Check that the manifest picks the right release asset (assets[] + match), or set extract if upstream ships a zip."
            failed=1
          done
          exit $failed

      - name: Reachability (warnings only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Non-blocking: CI network / host quirks shouldn't reject a valid PR.
          for f in packages/*.json; do
            src=$(jq -r '.source' "$f")
            if [ "$src" = "direct" ]; then
              url=$(jq -r '.url' "$f")
              code=$(curl -o /dev/null -sIL -w '%{http_code}' "$url" || echo 000)
              [ "$code" -lt 400 ] 2>/dev/null || echo "::warning file=$f::url $url returned HTTP $code"
            else
              repo=$(jq -r '.repo' "$f")
              host=$(jq -r '.host // "github"' "$f")
              if [ "$host" = "gitlab" ]; then
                gl_id=$(printf '%s' "$repo" | sed 's|/|%2F|g')
                code=$(curl -o /dev/null -sL -w '%{http_code}' \
                  "https://gitlab.com/api/v4/projects/$gl_id" || echo 000)
              else
                code=$(curl -o /dev/null -sL -w '%{http_code}' \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/$repo" || echo 000)
              fi
              [ "$code" = "200" ] || echo "::warning file=$f::repo $repo ($host) returned HTTP $code"
            fi
          done