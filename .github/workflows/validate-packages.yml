name: Validate Package Manifests

on:
  # pull_request_target runs immediately for fork PRs (no "Approve and run").
  # It runs THIS workflow from the base branch with the base repo's token, so
  # PR code must never be executed: only the PR's packages/*.json are pulled
  # in, as data. Schema, scripts and this workflow always come from main.
  pull_request_target:
    paths:
      - 'packages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Base branch checkout: trusted schema, scripts and workflow.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Overlay ONLY the PR's manifests. They are read by jq / check-jsonschema /
      # python json.load, never executed.
      - name: Take packages/ from the PR
        if: github.event_name == 'pull_request_target'
        run: |
          set -e
          git fetch --no-tags origin "pull/${{ github.event.pull_request.number }}/head:pr"
          rm -rf packages
          git checkout pr -- packages
          echo "Validating manifests from PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.head.sha }})"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tools
        run: pip install check-jsonschema

      - name: JSON Schema validation
        run: check-jsonschema --schemafile packages.schema.json packages/*.json

      - name: Structural checks (filenames, uniqueness)
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          errors = []
          repos, outputs = {}, {}
          for path in sorted(glob.glob("packages/*.json")):
              doc = json.load(open(path))
              repo = doc["repo"]

              # filename must match the repo slug: owner/repo -> owner__repo.json
              expected = repo.replace("/", "__") + ".json"
              actual = os.path.basename(path)
              if actual != expected:
                  errors.append(f"{actual}: filename must be '{expected}' (derived from repo '{repo}')")

              # one manifest per repo
              if repo in repos:
                  errors.append(f"{actual}: repo '{repo}' already defined in {repos[repo]}")
              repos[repo] = actual

              # output_name must be unique across the whole bundle (top-level + assets)
              names = []
              if "output_name" in doc:
                  names.append(doc["output_name"])
              for a in doc.get("assets", []):
                  names.append(a["output_name"])
              for n in names:
                  if n in outputs:
                      errors.append(f"{actual}: output_name '{n}' already used by {outputs[n]}")
                  outputs[n] = actual

          if errors:
              print("::error::Manifest validation failed:")
              for e in errors:
                  print(f"::error::  {e}")
              sys.exit(1)
          print(f"OK â€” {len(repos)} manifests, {len(outputs)} unique output names.")
          PY

      - name: Manifests compile cleanly
        run: bash scripts/build-manifests.sh

      - name: Reachability (warnings only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Non-blocking: CI network / host quirks shouldn't reject a valid PR.
          for f in packages/*.json; do
            src=$(jq -r '.source' "$f")
            if [ "$src" = "direct" ]; then
              url=$(jq -r '.url' "$f")
              code=$(curl -o /dev/null -sIL -w '%{http_code}' "$url" || echo 000)
              [ "$code" -lt 400 ] 2>/dev/null || echo "::warning file=$f::url $url returned HTTP $code"
            else
              repo=$(jq -r '.repo' "$f")
              host=$(jq -r '.host // "github"' "$f")
              if [ "$host" = "gitlab" ]; then
                gl_id=$(printf '%s' "$repo" | sed 's|/|%2F|g')
                code=$(curl -o /dev/null -sL -w '%{http_code}' \
                  "https://gitlab.com/api/v4/projects/$gl_id" || echo 000)
              else
                code=$(curl -o /dev/null -sL -w '%{http_code}' \
                  -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/$repo" || echo 000)
              fi
              [ "$code" = "200" ] || echo "::warning file=$f::repo $repo ($host) returned HTTP $code"
            fi
          done